apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-vision
  namespace: team01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nemotron-vision
  template:
    metadata:
      labels:
        app: nemotron-vision
    spec:
      imagePullSecrets:
      - name: ngc-secret
      containers:
      - name: nim-container
        image: nvcr.io/nim/nvidia/llama-3.1-nemotron-nano-vl-8b-v1:1.3.1
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-secret
              key: NGC_API_KEY
        ports:
        - containerPort: 8000
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-vision-service
  namespace: team01
spec:
  type: LoadBalancer
  selector:
    app: nemotron-vision
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000